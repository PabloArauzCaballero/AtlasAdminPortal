# Portal interno de Atlas, gestionado por COOLIFY.
#
# Va aparte de `docker-compose.dev.yml` —el del VPS operado a mano, con los `.env` en
# `/opt/atlas/env` y la red compartida `atlas_vps`— porque las dos formas de configurar son
# incompatibles.
#
# ## LO ÚNICO QUE HAY QUE ENTENDER DE ESTE ARCHIVO
#
# **`NEXT_PUBLIC_API_BASE_URL` se hornea AL CONSTRUIR, no al arrancar.** Next reemplaza las
# variables `NEXT_PUBLIC_*` por su valor literal dentro del JavaScript que descarga el navegador,
# así que cambiarla en Environment Variables y reiniciar **no hace absolutamente nada**: hay que
# RECONSTRUIR. Es la causa número uno de «el portal carga y el login falla con un error de red».
#
# Y la resuelve **el navegador**, no el contenedor. Es por eso que vale `/api/v1`, RELATIVA: el
# navegador la resuelve contra el origen del portal —el del túnel, con su HTTPS— y `rewrites()` en
# `next.config.ts` da el salto al backend desde dentro de Docker, donde `atlas-backend:3005` sí
# existe. Ese destino es `INTERNAL_API_ORIGIN`, más abajo, y ése SÍ se lee al arrancar.
#
# Lo que NO puede ser es una dirección absoluta del backend. Antes decía
# `http://100.101.207.88:3005/api/v1`, la IP de Tailscale, de cuando se entraba por el VPS: hoy la
# página se sirve por HTTPS desde un dev tunnel y esa llamada muere dos veces —el navegador de un
# tester no enruta una IP de Tailscale, y aunque la enrutara el navegador bloquea HTTP desde una
# página HTTPS (contenido mixto)—. El portal cargaba y el login fallaba con un error de red.
#
# Va como `build.args` en este archivo y no como variable de Coolify a propósito: así queda
# escrita junto a la explicación y no depende de que alguien marque la casilla correcta en la
# interfaz.
#
# ## Lo que este archivo NO trae
#
# La red externa `atlas_vps` —Coolify crea la suya por proyecto— ni `env_file`: Coolify añade
# `env_file: - .env` a cada servicio por su cuenta, con las variables de su interfaz dentro. Pega
# ahí `atlas-vps-testing/env/admin-portal.env`, EN BLOQUE.

name: atlas-admin-portal

services:
  portal:
    networks: ['default', 'coolify']
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    image: atlas-admin-portal:coolify
    build:
      context: .
      dockerfile: Dockerfile.dev
      cache_from: ['atlas-admin-portal:coolify']
      args:
        # La dirección que va a pedir el NAVEGADOR. Ver la nota de arriba: si cambias esto, hay
        # que reconstruir, no reiniciar. Relativa a propósito: mismo origen que el portal.
        NEXT_PUBLIC_API_BASE_URL: '/api/v1'
        NEXT_PUBLIC_ATLAS_ENVIRONMENT: 'vps-testing'
        # El destino de `rewrites()`: el backend visto DESDE EL CONTENEDOR. Aquí y no sólo en
        # `environment:` porque `output: 'standalone'` serializa la configuración de Next dentro
        # del `server.js` del build — definirla al arrancar no cambia el destino ya horneado.
        INTERNAL_API_ORIGIN: 'http://atlas-backend:3005'
    # `init: true` reparte SIGTERM al proceso de Node: sin un init como PID 1, el apagado no es
    # ordenado. Se pone aquí y no con un binario en la imagen para no depender de `apt`.
    init: true
    # SIN `ports:` — y es lo que evita el fallo que rompía cada redespliegue.
    #
    # Coolify nombra cada contenedor con una MARCA DE TIEMPO, así que en cada despliegue crea uno
    # NUEVO en vez de reemplazar el anterior. Mientras el viejo siga en pie sujeta el puerto del
    # host, y el nuevo muere con `failed to bind host port ...: address already in use`. No es un
    # puerto mal elegido: publicar un puerto FIJO desde el compose es incompatible con cómo
    # despliega Coolify.
    #
    # Quien publica este portal interno es el PROXY de Coolify. En la aplicación, pon en el campo de
    # dominio:  http://100.101.207.88:5273
    # Coolify configura entonces su proxy para escuchar ahí y enrutar al contenedor, y se encarga
    # él de retirar el anterior — que es justo lo que un compose con puerto fijo no puede hacer.
    # Se repite aquí a propósito, pero el que MANDA es el `build.args` de arriba: con
    # `output: 'standalone'` la reescritura ya está escrita en `server.js`. Esto sólo cubre
    # cualquier lectura de la variable en tiempo de ejecución, y evita que el valor quede
    # definido en un único sitio.
    #
    # Sin ninguno de los dos, Next cae a `http://127.0.0.1:3005`, que dentro de este contenedor no
    # es nadie, y cada `/api/v1/*` devuelve 500 con `ECONNREFUSED 127.0.0.1:3005` en el log.
    #
    # `atlas-backend` es el alias del API en la red compartida (ver el bloque `networks`).
    environment:
      INTERNAL_API_ORIGIN: 'http://atlas-backend:3005'
    expose: ['5273']
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

# ---------------------------------------------------------------------------------------------
# La red COMPARTIDA de Coolify.
#
# Es como este portal alcanza a los backends: por su ALIAS estable (`atlas-backend`, `motor`,
# `erp`), no por una IP del host. Coolify nombra cada contenedor con una marca de tiempo, así que
# los nombres cambian en cada despliegue pero los alias no.
#
# **Hace falta activar «Connect To Predefined Network» en esta aplicación dentro de Coolify.**
networks:
  default: {}
  coolify:
    external: true
    name: coolify
