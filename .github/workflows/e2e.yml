name: E2E

# CI lo invoca como gate obligatorio antes de desplegar dev. El verificador falla si
# Playwright termina en verde sin ejecutar casos reales.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (chromium) · fragmento ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `fail-fast: false`: si un fragmento cae, el otro sigue. Con `true` un fallo temprano deja la
    # mitad de la suite sin ejecutar y el informe unido queda incompleto sin decirlo.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_e2e_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_e2e_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: atlas
      DB_PASSWORD: atlas
      DB_NAME: atlas_e2e_admin
      DB_SSL: "false"
      REDIS_URL: redis://localhost:6379
      APP_PORT: 3005
      APP_ROLE: api
      API_PREFIX: api/v1
      API_RATE_LIMIT_MAX: 2000
      DATABASE_SEED_ON_STARTUP: "false"
      CORS_ORIGINS: http://localhost:5273
      INTERNAL_FRONTEND_ORIGIN: http://localhost:5273
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3005/api/v1
      DECISION_ENGINE_HEALTH_BASE_URL: http://localhost:8791
      ERP_BACKEND_BASE_URL: http://localhost:8791
      NOTIFICATION_EMAIL_PROVIDER: webhook
      NOTIFICATION_EMAIL_WEBHOOK_URL: http://localhost:8790/correo
      NOTIFICATIONS_DELIVERY_MODE: inline
      AUTH_LOGIN_PIN_ENABLED: "true"
      RUNTIME_JOBS_SCHEDULER_ENABLED: "false"
      TEST_EMAIL: qa-admin-e2e@atlas-qa.example.com
      TEST_TENANT_ID: "1"
      E2E_USER_ID: "930007"
      PW_PIN_INBOX_PORT: "8790"
      ALLOW_E2E_CATALOG_REFRESH: "true"
    steps:
      - uses: actions/checkout@v7

      # SHA fijo: el E2E mide siempre el mismo código backend que pasó revisión.
      - name: Obtener AtlasBackend para el stack QA
        uses: actions/checkout@v7
        with:
          repository: PabloArauzCaballero/AtlasBackend
          ref: 57d0da8f2c79ff1946b8a4e5517dfb4c3f8c99c4
          path: qa-backend
          persist-credentials: false

      # Next revisa recursivamente *.ts bajo la raíz del portal. El backend tiene su propio
      # tsconfig y debe compilarse por separado para que no contamine el type-check de Next.
      - name: Aislar checkout backend del árbol de Next
        run: mv qa-backend "$RUNNER_TEMP/qa-backend"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Instalar dependencias del backend
        run: yarn install --frozen-lockfile
        working-directory: ${{ runner.temp }}/qa-backend

      - name: Crear claves efímeras del runner
        shell: bash
        run: |
          password="Qa9!$(openssl rand -hex 32)"
          jwt="$(openssl rand -hex 48)"
          notification="$(openssl rand -hex 48)"
          catalog="$(openssl rand -hex 48)"
          echo "::add-mask::$password"
          echo "::add-mask::$jwt"
          echo "::add-mask::$notification"
          echo "::add-mask::$catalog"
          echo "TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "JWT_ACCESS_TOKEN_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "NOTIFICATION_TOKEN_ENCRYPTION_KEY=$notification" >> "$GITHUB_ENV"
          echo "ERP_BACKEND_CATALOG_API_KEY=$catalog" >> "$GITHUB_ENV"

      - name: Servir manifiestos de contrato de bloques externos
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 scripts/qa-catalog-manifest-server.py > "$RUNNER_TEMP/qa-catalog.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8791/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qa-catalog.log"
          exit 1

      - name: Compilar backend real
        run: yarn build
        working-directory: ${{ runner.temp }}/qa-backend

      - name: Migrar y sembrar datos sintéticos de QA
        run: |
          yarn db:migration:up
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -c "INSERT INTO iam.tenants (_id, tenant_code, legal_name, country_code, status, _created_at, _deleted)
                VALUES (1, 'atlas-qa-e2e', 'Atlas QA E2E', 'BOL', 'active', now(), false)
                ON CONFLICT (_id) DO NOTHING"
          yarn db:seed:demo
          yarn db:seed:admin-e2e
        working-directory: ${{ runner.temp }}/qa-backend
        env:
          NODE_ENV: development
          ALLOW_E2E_SEED: "true"

      - name: Arrancar API y esperar readiness
        shell: bash
        run: |
          set -euo pipefail
          nohup node dist/src/main.js > "$RUNNER_TEMP/atlas-backend.log" 2>&1 &
          backend_pid=$!
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://localhost:3005/api/v1/health/readiness > /dev/null 2>&1; then
              echo 'API QA lista.'
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo 'El API terminó antes de readiness:'
              tail -n 100 "$RUNNER_TEMP/atlas-backend.log"
              exit 1
            fi
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/atlas-backend.log"
          exit 1
        working-directory: ${{ runner.temp }}/qa-backend
        env:
          NODE_ENV: development
          FILE_STORAGE_ADAPTER: local
          FILE_STORAGE_LOCAL_ROOT: ${{ runner.temp }}/atlas-files

      - name: Instalar navegador (chromium) con sus libs de sistema
        run: yarn playwright install --with-deps chromium

      - name: Build de la app
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Preparar assets de standalone
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi

      - name: Correr E2E
        run: yarn playwright test --shard=${{ matrix.shard }}/2 --reporter=blob,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Diagnosticar fallo de catálogo QA
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          grep -n -E -C 2 'duplicate key|violates unique|SequelizeUniqueConstraintError|Validation error|Federación de' "$RUNNER_TEMP/atlas-backend.log" | tail -n 80 || true
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -tA \
            -c "SELECT system_code, last_status, endpoints_imported, data_entities_imported
                  FROM platform_ops.system_block_federation_state ORDER BY system_code" || true

      # Un verde que se saltó las pruebas no es un verde. Este paso lo convierte en rojo.
      - name: Comprobar que la suite corrió de verdad
        if: ${{ !cancelled() }}
        run: node scripts/verificar-e2e.mjs test-results/results.json

      - name: Comprobar que el reporte no conserva la clave QA
        if: success()
        run: python3 scripts/assert-no-e2e-secret.py blob-report/

      - name: Subir el informe parcial del fragmento
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  # Los fragmentos producen informes PARCIALES: sin este trabajo no hay forma de leer la corrida
  # completa, sólo mitades sueltas.
  informe:
    name: Unir los informes de los fragmentos
    if: success()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          path: todos-los-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Unir
        run: yarn playwright merge-reports --reporter=html ./todos-los-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
