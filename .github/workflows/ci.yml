name: CI

# `dev` es la rama que despliega `deploy-dev.yml`. Mientras esto decía sólo `main`, un push a dev
# desplegaba el portal SIN haber pasado una sola puerta: type-check, lint, pruebas, build, gitleaks
# y auditoría de dependencias no se ejecutaban nunca sobre lo que se estaba sirviendo.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Un solo run por rama: cancela el anterior si llega un push nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Calidad estática: límites de arquitectura, formato, tipos y lint.
  # ---------------------------------------------------------------
  quality:
    name: Calidad (tipos, lint, límites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validar referencias a submódulos
        run: git submodule status

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Contrato del smoke público
        run: node --test .github/tests/post-deploy-smoke.test.mjs

      - name: Máximo 300 líneas por archivo
        run: yarn max-lines

      - name: Límites de arquitectura (sin fetch fuera de la capa de transporte)
        run: yarn source-boundaries

      - name: Formato (Prettier)
        run: yarn format:check

      - name: TypeScript
        run: yarn type-check

      - name: ESLint
        run: yarn lint

  # ---------------------------------------------------------------
  # Tests unitarios (Vitest + Testing Library sobre jsdom).
  # Los tests viven en tests/, fuera de src/, para que las guardas de
  # arquitectura (source-boundaries) sigan aplicando solo a producción.
  # ---------------------------------------------------------------
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Vitest con cobertura
        run: yarn test:coverage

  # ---------------------------------------------------------------
  # Build estricto: next.config.ts ya NO ignora errores de TS/ESLint.
  # ---------------------------------------------------------------
  build:
    name: Build estricto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: next build
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---------------------------------------------------------------
  # Seguridad: escaneo de secretos. Sin `yarn install` a propósito,
  # así el scan no recorre node_modules y termina en segundos.
  # ---------------------------------------------------------------
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Detectar secretos en el árbol de trabajo
        run: ./gitleaks detect --no-git --source . --redact --config .gitleaks.toml

  # ---------------------------------------------------------------
  # Auditoría de dependencias (high+). Bloqueante.
  # `yarn audit` de Yarn 1 está descontinuado (su endpoint devuelve 410),
  # así que se genera un package-lock desde package.json y se usa `npm audit`,
  # cuyo endpoint de advisories sigue activo.
  # ---------------------------------------------------------------
  audit:
    name: Auditoría de dependencias (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generar package-lock desde package.json (sin instalar)
        run: npm install --package-lock-only --ignore-scripts

      - name: Auditar vulnerabilidades high/critical
        run: npm audit --audit-level=high

  # El broker OIDC/PKCE vive en este repositorio con su propio lockfile. Su build y
  # sus pruebas de seguridad son obligatorios para publicar el portal.
  auth-worker:
    name: Broker de identidad (calidad, seguridad, imagen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: atlas-auth-broker-worker/yarn.lock

      - name: Instalar dependencias del broker
        run: yarn --cwd atlas-auth-broker-worker install --frozen-lockfile
      - name: Formato del broker
        run: yarn --cwd atlas-auth-broker-worker format:check
      - name: ESLint del broker
        run: yarn --cwd atlas-auth-broker-worker lint
      - name: Tipos del broker
        run: yarn --cwd atlas-auth-broker-worker typecheck
      - name: Pruebas de seguridad del broker
        run: yarn --cwd atlas-auth-broker-worker test
      - name: Compilar el broker
        run: yarn --cwd atlas-auth-broker-worker build
      - name: Smoke HTTP real del broker con IdP de prueba
        run: yarn --cwd atlas-auth-broker-worker smoke:e2e
      - name: Auditar dependencias del broker
        run: |
          npm install --package-lock-only --ignore-scripts --prefix atlas-auth-broker-worker
          npm audit --audit-level=high --prefix atlas-auth-broker-worker
      - name: Construir imagen del broker
        run: docker build -f atlas-auth-broker-worker/Dockerfile -t atlas-auth-broker-worker:ci atlas-auth-broker-worker

  e2e:
    name: Playwright E2E obligatorio
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  deploy-dev:
    name: Desplegar DEV sólo después de CI y E2E
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - quality
      - test
      - build
      - secrets
      - audit
      - auth-worker
      - e2e
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
